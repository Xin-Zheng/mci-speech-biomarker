[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mci-biomarker"
version = "0.1.0"
description = "Digital speech biomarker monitoring system for MCI — dual-track acoustic + linguistic analysis with longitudinal personal-baseline tracking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MCI Biomarker Team" }]
keywords = ["mci", "speech", "biomarker", "egemaps", "whisper", "diarization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
# Core deps are intentionally light so the MVP runs anywhere (incl. Python 3.14).
# Heavy model/audio deps live in optional extras and degrade gracefully when absent.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "click>=8.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
acoustic = [
    "librosa>=0.10",
    "opensmile>=2.5",
    "praat-parselmouth>=0.4.3",
]
asr = [
    "faster-whisper>=1.0",
]
diarize = [
    "pyannote.audio>=3.1",
    "torch>=2.0",
]
nlp = [
    "spacy>=3.7",
]
full = [
    "mci-biomarker[acoustic,asr,diarize,nlp]",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
mci-analyze = "mci_biomarker.cli:main"
mci-serve = "mci_biomarker.web.app:serve"

[tool.hatch.build.targets.wheel]
packages = ["src/mci_biomarker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
